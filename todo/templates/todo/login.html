<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
           display: flex;
           justify-content: center;
           align-items: center;
           min-height: 100vh;
           background-color: #f8f9fa;
           margin: 0;   
        }

        .card {
            width: 100%;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            
        }
        input,  button {
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            font-size: 16px;
            box-sizing : border-box;
        }
        form input 
        {
            display: block;
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
        }
        /* dark mode and light mode  */
        body.dark-mode {
            background-color: #121212;
            color: #f1f1f1;
        }
        .dark-mode .card{
            background-color: #1e1e1e;
            color: #f1f1f1;
        }

        .dark-mode input {
            background-color: #2b2b2b;
            color: white;
            border-color: #555;
        }
        .dark-mode input::placeholder
        {
            color: #bbb;
        }
    </style>
</head>
<body>
    <div class="card p-4 w-100" style="max-width: 400px;">
        <h1>Login</h1>

        <button type="button" id="themeToggle"
            class="btn btn-outline-secoundry mb-3">
            🌙 Dark
        </button>

        <!-- show error if wrong  -->
       {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'success' %}alert-success{% elif message.tags == 'info' %}alert-info{% else %}alert-warning{% endif %}"
                     role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username or email address" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <p class="mt-3">
            Don't have an account?
            <a href="{% url 'register' %}">Register here</a>
        </p>
    </div>
   
    <script>
        // call the html element 
        const themeToggle = document.getElementById("themeToggle");
        const body = document.body;

        themeToggle.addEventListener("click" , function() {
            body.classList.toggle("dark-mode");

            if(body.classList.contains("dark-mode")){
                themeToggle.textContent = "🌞 Light Mode";
            }
            else{
                themeToggle.textContent = "🌛 Dark-Mode";
            }
        })
    </script>
</body>
</html>
