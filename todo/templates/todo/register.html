<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
      <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            margin: 0;
            padding: 16px;
            transition: background-color 0.3s, color 0.3s;
        }

        .card{
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        form label
        {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            text-align: left;
        }
        .card form p {
            margin-bottom: 16px;
            text-align: left;
        }
        .card form input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
        }
        body.dark-mode {
        background-color: #121212;
        color: #f1f1f1;
    }

    .dark-mode .card {
        background-color: #1e1e1e;
        color: #f1f1f1;
        border-color:  #444;
    }

    .dark-mode input {
        background-color: #2b2b2b;
        color: white;
        border-color: #555;
    }

    .dark-mode input::placeholder {
        color: #bbb;
    }

    .dark-mode a {
        color: #8ab4f8;
    }
      </style>
</head>
<body> 
    <div class="card">   
        <h1 class="text-center mb-3">Create Your Account</h1>

        <button type="button" id="themeToggle" class="btn btn-outline-secondary  mb-3">🌛 Dark Mode</button>

        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'success' %}alert-success{% elif message.tags == 'info' %}alert-info{% else %}alert-warning{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>

        <p class="text-center mt-3 mb-0">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </p>
    </div>

    <script>
        // call the html element 
        const themeToggle = document.getElementById("themeToggle");
        const body = document.body;

        themeToggle.addEventListener("click" , function() {
            body.classList.toggle("dark-mode");

            if(body.classList.contains("dark-mode")){
                themeToggle.textContent = "🌞 Light Mode";
            }
            else{
                themeToggle.textContent = "🌛 Dark-Mode";
            }
        })
    </script>
</body>
</html>
